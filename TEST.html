<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Án Nuôi Em - Chắp Cánh Ước Mơ</title>
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* HEADER & HERO */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 3.5rem 1rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* CONTAINER & FILTERS */
        .container {
            max-width: 1200px;
            margin: -30px auto 0;
            padding: 0 1.5rem;
        }

        .filter-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: #f8fafc;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        /* GRID CÁC EM */
        .grid-children {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* CARD CHILD */
        .child-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .child-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card-img-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-code {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-status.completed {
            background: var(--secondary);
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .child-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .child-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }

        .child-info div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .child-info i {
            color: var(--primary);
            width: 16px;
        }

        /* PROGRESS BAR */
        .progress-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 12px;
            margin-top: auto;
        }

        .progress-bar-bg {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .amount-raised { color: var(--secondary); }
        .amount-target { color: var(--text-muted); }

        .btn-donate {
            width: 100%;
            margin-top: 1rem;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-donate:hover { background: var(--primary-hover); }
        .btn-donate:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* MODAL PAYMENT */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
        }

        .qr-card {
            background: #f8fafc;
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin: 1rem 0;
        }

        .qr-card img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
        }

        .transfer-code-box {
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .btn-copy {
            background: white;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>NUÔI EM</span>
            </div>
            <div>
                <i class="fa-solid fa-phone"></i> Hỗ trợ: 1900 xxxx
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Cùng Chắp Cánh Ước Mơ Cho Trẻ Em Vùng Cao</h1>
        <p>Chọn một em nhỏ để đồng hành, nhận mã chuyển khoản và giúp em tiếp bước đến trường.</p>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Bộ lọc nghiệp vụ -->
        <div class="filter-card">

                    <option value="all">Tất cả tỉnh thành</option>
                    <option value="Sơn La">Sơn La</option>
                    <option value="Hà Giang">Hà Giang</option>
                    <option value="Điện Biên">Điện Biên</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fa-solid fa-school"></i> Điểm trường</label>
                <select id="filterSchool">
                    <option value="all">Tất cả điểm trường</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fa-solid fa-filter"></i> Trạng thái ủng hộ</label>
                <select id="filterStatus">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="pending">Đang cần giúp đỡ</option>
                    <option value="completed">Đã đủ chỉ tiêu</option>
                </select>
            </div>
        </div>

        <!-- Danh sách em nhỏ -->
        <div class="grid-children" id="childrenGrid">
            <!-- Render bằng JavaScript -->
        </div>
    </div>

    <!-- Modal Chuyển Khoản / VietQR -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 5px;" id="modalChildName">Thông tin ủng hộ</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);" id="modalChildSchool"></p>

            <div class="qr-card">
                <p style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">QUÉT MÃ VIETQR ĐỂ CHUYỂN KHOẢN</p>
                <!-- Giả lập VietQR với mã động -->
                <img id="qrImage" src="" alt="VietQR Code">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Hệ thống tự động nhận diện giao dịch</p>
            </div>

            <div>
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">MÃ CHUYỂN KHOẢN (BẮT BUỘC KHÔNG SỬA):</label>
                <div class="transfer-code-box">
                    <span id="transferCode">NE-XXXX</span>
                    <button class="btn-copy" onclick="copyCode()"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
            </div>

            <div style="margin-top: 1rem; font-size: 0.85rem; background: #fff7ed; border: 1px solid #ffedd5; padding: 10px; border-radius: 8px; color: #c2410c;">
                <i class="fa-solid fa-triangle-exclamation"></i> <strong>Số tiền còn thiếu:</strong> <span id="modalRemaining">0</span> VNĐ
            </div>

            <button class="btn-donate" style="margin-top: 1rem;" onclick="closeModal()">
                <i class="fa-solid fa-check"></i> Tôi đã hoàn tất chuyển khoản
            </button>
        </div>
    </div>
